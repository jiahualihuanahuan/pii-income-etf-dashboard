# Start:  cp .env.example .env   (optional)   then   docker compose up -d
# UI:     http://localhost:8080   (change WEB_PORT in .env; BIND_ADDR=0.0.0.0 to expose on your network)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ./config:/app/config      # editable: tickers.yaml, settings.yaml
      - appdata:/data             # SQLite, transcripts, UI settings override
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  appdata:
